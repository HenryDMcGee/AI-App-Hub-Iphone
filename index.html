<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Henry's AI Apps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iPhone-4-era home screen — black status bar, 4-up glossy icon grid, iOS 4 folders on linen, glass dock; press-and-hold enters jiggle mode to drag and delete */
:root {
  --night: #04121f;
  --label: #ffffff;
  --status: #000000;
  --status-fg: #e9e9e9;
  --linen: #2c2e34;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ic: 60px;
  --c-crm: #1f6f54;
  --c-watch: #2f86e0;
  --c-public: #2fa86e;
  --c-site: #6a6f7a;
  --c-git: #3a3f48;
  --c-jira: #1f6fe0;
  --c-linear: #6d5ce8;
  --c-doc: #c9417c;
  --c-planner: #bf5700;
  --c-mars: #c1440e;
  color-scheme: dark;
}
@media (min-width: 560px) { :root { --ic: 68px; } }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--label); font-family: var(--font); }
#wall { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; }

.statusbar { position: relative; z-index: 3; background: var(--status); color: var(--status-fg); font-size: 12px; font-weight: 700; }
.statusbar .in {
  max-width: 520px; margin: 0 auto; height: 22px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.carrier { display: flex; align-items: center; gap: 5px; }
.bars { display: flex; align-items: flex-end; gap: 1.5px; height: 10px; }
.bars i { width: 3px; background: var(--status-fg); border-radius: .5px; }
.bars i:nth-child(1) { height: 3px; } .bars i:nth-child(2) { height: 5px; } .bars i:nth-child(3) { height: 7px; } .bars i:nth-child(4) { height: 9px; } .bars i:nth-child(5) { height: 10px; opacity: .35; }
#time { font-variant-numeric: tabular-nums; }
.battery { justify-self: end; display: flex; align-items: center; }
.battery .cell { width: 22px; height: 10px; border: 1px solid var(--status-fg); border-radius: 2px; padding: 1px; box-sizing: border-box; }
.battery .cell i { display: block; height: 100%; width: 82%; background: var(--status-fg); border-radius: 1px; }
.battery .nub { width: 2px; height: 4px; background: var(--status-fg); border-radius: 0 1px 1px 0; }

/* edit-mode toolbar */
.editbar[hidden] { display: none !important; }
.editbar {
  position: fixed; z-index: 3; left: 0; right: 0; top: calc(22px + env(safe-area-inset-top, 0px));
  background: linear-gradient(180deg, rgba(30,34,44,.92), rgba(10,12,18,.92)); border-bottom: 1px solid rgba(255,255,255,.12);
}
.editbar .in {
  max-width: 520px; margin: 0 auto; height: 38px; display: flex; align-items: center; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.editbar .hint { flex: 1; min-width: 0; text-align: center; font-size: 11.5px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb {
  font: 700 12px var(--font); color: #fff; border-radius: 5px; padding: 6px 11px; cursor: pointer;
  border: 1px solid rgba(0,0,0,.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  background: linear-gradient(180deg, #6d7686, #3c4350 50%, #2f353f);
  text-shadow: 0 -1px 0 rgba(0,0,0,.6);
}
.tb.primary { background: linear-gradient(180deg, #6aa0f0, #2f6ed8 50%, #2460c4); }
.tb:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.screen {
  position: relative; z-index: 1; max-width: 520px; margin: 0 auto; box-sizing: border-box;
  min-height: calc(100% - 22px); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 26px 10px; transition: padding-top .2s ease;
}
.editing .screen { padding-top: 66px; }

#home { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 22px; column-gap: 6px; justify-items: center; align-content: start; min-height: calc(var(--ic) + 30px); }

.slot { position: relative; width: 100%; min-width: 0; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.editing .slot { touch-action: none; cursor: grab; }
.slot.placeholder { visibility: hidden; }

.app { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: var(--label); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; width: 100%; min-width: 0; -webkit-user-drag: none; }
.app:focus-visible { outline: none; }
.app:focus-visible .icon { outline: 2px solid #fff; outline-offset: 3px; }
.icon {
  position: relative; width: var(--ic); height: var(--ic); border-radius: calc(var(--ic) * .2); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 62%, #fff), var(--c) 52%, color-mix(in srgb, var(--c) 72%, #000));
  box-shadow: 0 2px 4px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.12);
  transition: transform .12s ease, filter .12s ease;
}
.icon::after {
  content: ""; position: absolute; left: -18%; right: -18%; top: -62%; height: 112%; border-radius: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.14));
  pointer-events: none;
}
.icon svg { position: relative; z-index: 1; width: 54%; height: 54%; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 -1px 0 rgba(0,0,0,.35)); }
.icon.iw { background: #05060A; box-shadow: 0 2px 4px rgba(0,0,0,.6), inset 0 0 0 1px rgba(34,211,238,.35); }
.icon.iw::after { opacity: .4; }
.icon.iw svg { position: absolute; inset: 0; width: 100%; height: 100%; stroke: none; filter: none; z-index: 0; }
.icon.crmi svg { position: absolute; inset: 0; width: 100%; height: 100%; stroke: none; filter: drop-shadow(0 -1px 0 rgba(0,0,0,.3)); z-index: 0; }
.icon.hm { background: #10141c; }
.icon.hm img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; -webkit-user-drag: none; }
.icon.hm::after { opacity: .45; }
body:not(.editing) .app:active .icon { filter: brightness(.7); }
body:not(.editing) .app:hover .icon { transform: scale(1.05); }
.label { font-size: 10px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.9); }

.folder .icon { background: rgba(0,0,0,.34); box-shadow: 0 2px 4px rgba(0,0,0,.55), inset 0 1px 2px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.18); display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: max-content; gap: 3px; padding: 9px; box-sizing: border-box; align-content: start; }
.folder .icon::after { opacity: .35; }
.mini { width: 100%; aspect-ratio: 1; border-radius: 3px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 60%, #fff), var(--c)); box-shadow: 0 1px 1px rgba(0,0,0,.5); }

.waiting .icon { filter: brightness(.45) saturate(.6); }
.waiting .progress { position: absolute; z-index: 2; left: 14%; right: 14%; bottom: 20%; height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); box-shadow: inset 0 1px 1px rgba(0,0,0,.6); overflow: hidden; }
.waiting .progress i { display: block; height: 100%; width: 6%; background: #fff; border-radius: 3px; }
.waiting { cursor: default; }

/* jiggle + delete badge */
@keyframes jiggle { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }
.editing .slot .app { animation: jiggle .13s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
.del {
  display: none; position: absolute; z-index: 4; top: -8px; left: calc(50% - var(--ic) / 2 - 10px);
  width: 24px; height: 24px; border-radius: 50%; padding: 0; cursor: pointer;
  background: radial-gradient(circle at 50% 35%, #555, #111 70%); border: 2px solid #fff; color: #fff;
  box-shadow: 0 2px 3px rgba(0,0,0,.7); align-items: center; justify-content: center;
}
.del svg { width: 10px; height: 10px; stroke: #fff; stroke-width: 3; stroke-linecap: round; }
.del:focus-visible { outline: 2px solid #8cc4ff; outline-offset: 2px; }
.editing .del { display: flex; }

.ghost { position: fixed; z-index: 20; pointer-events: none; margin: 0; transform: scale(1.18); opacity: .92; transition: none; }
.ghost .app { animation: none !important; }
.ghost .del, .ghost .label { display: none !important; }
.ghost .icon { box-shadow: 0 10px 18px rgba(0,0,0,.6); }

/* glass dock shelf */
.dock { position: relative; margin-top: auto; padding: 16px 4px 10px; }
.dock::before {
  content: ""; position: absolute; left: 2%; right: 2%; bottom: 0; height: 58%;
  background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.2) 35%, rgba(255,255,255,.08));
  border-top: 1px solid rgba(255,255,255,.75); border-radius: 3px 3px 0 0;
  transform: perspective(240px) rotateX(34deg); transform-origin: bottom center;
  box-shadow: 0 -1px 6px rgba(0,0,0,.35);
}
#dock { position: relative; display: flex; justify-content: center; min-height: calc(var(--ic) + 22px); }
#dock .slot { width: 25%; flex: none; }
#dock .icon { -webkit-box-reflect: below 2px linear-gradient(transparent 62%, rgba(255,255,255,.28)); }

/* opened folder on linen */
.sheet[hidden], .alert[hidden] { display: none !important; }
.sheet, .alert { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel {
  width: min(480px, 100%); box-sizing: border-box; border-radius: 6px; padding: 16px 16px 22px;
  background-color: var(--linen);
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.2));
  box-shadow: inset 0 6px 10px -4px rgba(0,0,0,.8), inset 0 -6px 10px -4px rgba(0,0,0,.8), 0 10px 30px rgba(0,0,0,.6);
  animation: drop .22s ease-out;
}
@keyframes drop { from { transform: scaleY(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.panel h2 { margin: 0 0 16px 4px; font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9); }
.panel .fgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 18px; column-gap: 6px; justify-items: center; }

/* iOS-4-style alert */
.box {
  position: relative; width: min(280px, 100%); box-sizing: border-box; overflow: hidden; text-align: center;
  padding: 18px 14px 14px; border-radius: 11px; border: 2px solid rgba(255,255,255,.85);
  background: linear-gradient(180deg, rgba(64,84,132,.95), rgba(22,36,78,.96));
  box-shadow: 0 8px 26px rgba(0,0,0,.7); animation: pop .18s ease-out;
}
.box::before { content: ""; position: absolute; left: -30%; right: -30%; top: -70%; height: 110%; border-radius: 50%; background: rgba(255,255,255,.12); pointer-events: none; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.box h3 { position: relative; margin: 0 0 6px; font-size: 17px; text-shadow: 0 -1px 0 rgba(0,0,0,.6); }
.box p { position: relative; margin: 0 0 16px; font-size: 13.5px; line-height: 1.35; color: rgba(255,255,255,.88); }
.box .row { position: relative; display: flex; gap: 8px; }
.ab {
  flex: 1; font: 700 15px var(--font); color: #fff; padding: 9px 0; border-radius: 6px; cursor: pointer;
  border: 1px solid rgba(0,0,0,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.08) 50%, rgba(255,255,255,.02));
  text-shadow: 0 -1px 0 rgba(0,0,0,.6);
}
.ab.danger { background: linear-gradient(180deg, #f07a72, #d23b31 50%, #b82e25); }
.ab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .panel, .box { animation: none; }
  .icon { transition: none; }
  body:not(.editing) .app:hover .icon { transform: none; }
  .editing .slot .app { animation: none; }
  .editing .slot .icon { outline: 1px dashed rgba(255,255,255,.6); outline-offset: 3px; }
  .screen { transition: none; }
}

/* ---------- phone view: paw-unlock intro, then the app running inside the phone ---------- */
#app { height: 100%; }
#backdrop, #stage { display: none; }
body.phone-mode { background: #e8d3bd; overflow: hidden; height: 100%; }
.phone-mode #backdrop { display: block; position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.phone-mode #stage { display: block; position: fixed; left: 50%; top: calc(50% + var(--stage-dy, 0px)); width: 340px; height: 700px; margin: -350px 0 0 -170px; transform: scale(var(--k, 1)); z-index: 1; }
.phone-shell { position: absolute; inset: 0; border-radius: 54px; padding: 4px; box-sizing: border-box;
  background: linear-gradient(135deg, #eef0f3 0%, #8a8e96 26%, #d6d9de 50%, #62666e 76%, #c3c6cc 100%);
  box-shadow: 0 46px 60px -20px rgba(70,40,20,.55), 0 14px 24px rgba(70,40,20,.3); }
.phone-body { position: relative; width: 100%; height: 100%; border-radius: 50px; background: linear-gradient(160deg, #1f2125 0%, #060708 60%, #141518 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.earpiece { position: absolute; left: 50%; top: 38px; width: 60px; height: 7px; margin-left: -30px; border-radius: 4px; background: #24262a; box-shadow: inset 0 1px 2px rgba(0,0,0,.9); }
.cam { position: absolute; left: 96px; top: 35px; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #3c4b68, #0a0c12 70%); }
.device-screen { position: absolute; left: 22px; top: 82px; width: 296px; height: 522px; overflow: hidden; background: #000; transform: translateZ(0); --ic: 52px; }
.device-screen #app { position: absolute; inset: 0; height: auto; }
.device-screen .screen { min-height: calc(100% - 22px); }
.device-screen .label { font-size: 8.5px; letter-spacing: -.02em; }
.device-screen.intro #app { pointer-events: none; }
.glare { position: absolute; inset: 4px; border-radius: 50px; pointer-events: none; background: linear-gradient(118deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 34%, rgba(255,255,255,0) 36%); }
.homebtn { position: absolute; left: 143px; top: 623px; width: 54px; height: 54px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle at 50% 30%, #2b2d32, #0c0d0f 70%); box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); }
.homebtn span { position: absolute; left: 19px; top: 19px; width: 14px; height: 14px; border: 1.5px solid rgba(255,255,255,.32); border-radius: 4px; box-sizing: border-box; }
.homebtn:focus-visible { outline: 2px solid #2f86e0; outline-offset: 3px; }
#paw { position: absolute; left: 0; top: 0; width: 388.6px; height: 1181.3px; z-index: 5; pointer-events: none; transform-origin: 192.3px 8.7px;
  transform: translate(-200px, 1400px); filter: sepia(.22) saturate(1.15) drop-shadow(0 16px 18px rgba(90,50,20,.38)) drop-shadow(0 3px 4px rgba(60,30,10,.3)); }
#paw[hidden] { display: none; }

/* lock screen shown during the intro */
#lock[hidden] { display: none; }
#lock { position: absolute; inset: 0; z-index: 15; pointer-events: none; color: #fff; font-family: var(--font); }
#lock::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.16); }
.lock-top { position: absolute; left: 0; right: 0; top: 22px; height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.38)); border-bottom: 1px solid rgba(255,255,255,.14); }
.lock-time { font-size: 62px; font-weight: 200; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.lock-date { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); }
.lock-bot { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.62)); border-top: 1px solid rgba(255,255,255,.14); }
.track { position: absolute; left: 22px; right: 22px; top: 22px; height: 48px; border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, #08090b, #2a2c31); box-shadow: inset 0 2px 4px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.14); }
.trail { position: absolute; left: 3px; top: 3px; width: 238px; height: 42px; border-radius: 9px; background: linear-gradient(90deg, rgba(47,134,224,0), rgba(47,134,224,.45)); transform: scaleX(0); transform-origin: 0 50%; }
.slide-label { position: absolute; left: 82px; right: 8px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 17px; color: transparent;
  background: linear-gradient(90deg, rgba(255,255,255,.32) 0%, rgba(255,255,255,.32) 40%, #fff 50%, rgba(255,255,255,.32) 60%, rgba(255,255,255,.32) 100%); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; animation: shimmer 2.4s linear infinite; }
@keyframes shimmer { from { background-position: 160% 0; } to { background-position: -60% 0; } }
.knob { position: absolute; left: 3px; top: 3px; width: 68px; height: 42px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #fdfdfd 0%, #d8dade 49%, #b6b9bf 51%, #e4e5e8 100%); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.knob svg { width: 26px; height: 26px; fill: none; stroke: #6b6f77; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

#lock .taphint[hidden] { display: none; }
#lock .taphint { position: absolute; left: 50%; top: 330px; transform: translateX(-50%); pointer-events: auto; z-index: 2; white-space: nowrap;
  height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,.55); background: rgba(0,0,0,.45); color: #fff;
  font: 700 13px var(--font); cursor: pointer; animation: hintpulse 1.6s ease-in-out infinite; }
@keyframes hintpulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
/* the apps stay hidden behind the lock screen, then settle in */
#home, .dock { transition: opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1); }
#app.locked #home, #app.locked .dock { opacity: 0; transform: scale(1.12); }

/* view switches */
.topbtns { display: none; }
.phone-mode .topbtns { display: flex; gap: 10px; position: fixed; top: 16px; right: 16px; z-index: 30; }
.viewbtn { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 14px;
  border: 1px solid rgba(255,255,255,.6); border-radius: 22px; background: rgba(43,34,28,.74); color: #fff; font: 600 14px var(--font); cursor: pointer; box-shadow: 0 4px 12px rgba(60,30,10,.3); }
.viewbtn svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.viewbtn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.musicbtn[aria-pressed="false"] { background: rgba(43,34,28,.5); color: rgba(255,255,255,.8); }
.musicbtn .off { display: none; }
.musicbtn[aria-pressed="false"] .on { display: none; }
.musicbtn[aria-pressed="false"] .off { display: inline; }
.sb-right { justify-self: end; display: flex; align-items: center; gap: 8px; }
.sbbtn { font: 700 10.5px var(--font); color: var(--status-fg); background: transparent; border: 1px solid rgba(255,255,255,.4); border-radius: 9px; padding: 1px 8px; cursor: pointer; line-height: 14px; }
.sbbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.phone-mode .sbbtn { display: none; }

/* plane fly-by */
.flyby { position: absolute; left: 0; top: max(10px, 3.2vh); z-index: 0; animation: flyby 30s linear 3s infinite both; will-change: transform; }
@keyframes flyby { 0% { transform: translateX(-490px); } 45% { transform: translateX(calc(100vw + 30px)); } 100% { transform: translateX(calc(100vw + 30px)); } }
.flyby-inner { display: flex; align-items: center; animation: flybob 2.6s ease-in-out infinite; }
@keyframes flybob { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-7px) rotate(1.2deg); } }
.fb-banner { transform-origin: 100% 50%; animation: bannerwave .7s ease-in-out infinite alternate; }
@keyframes bannerwave { from { transform: skewY(1.6deg) scaleY(.97); } to { transform: skewY(-1.6deg) scaleY(1.02); } }
.fb-prop { transform-box: fill-box; transform-origin: center; animation: propspin .14s linear infinite; }
@keyframes propspin { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.12); } }
@media (prefers-reduced-motion: reduce) { .flyby { display: none; } }

/* cute background bits */
.cute { position: absolute; transform: translate(-50%, -50%); line-height: 0; }
.cute svg { display: block; }
.petal { top: -6vh; animation-name: petalfall; animation-timing-function: linear; animation-iteration-count: infinite; }

    iw: '<rect width="60" height="60" fill="#05060A"/>' +
        '<polygon points="0,0 25,23 25,37 0,60" fill="#171b24"/>' +

        '<polygon points="16,33 20,33.3 20,35.8 16,36.3" fill="#22D3EE" opacity=".8"/>' +
        '<polygon points="56,13 49,18.5 49,24 56,20" fill="#22D3EE"/>' +
        '<polygon points="56,35 49,34 49,38.5 56,40.5" fill="#22D3EE" opacity=".9"/>' +
        '<polygon points="45,21.5 40,24.8 40,27.8 45,25.5" fill="#1E6BFF"/>' +

        '<rect x="28.5" y="29" width="3" height="1.6" fill="#22D3EE" opacity=".7"/>',
    crmlogo: '<path d="M25.5 15v-2.2a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2V15" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>' +
        '<rect x="18" y="15" width="24" height="14" rx="2.6" fill="#fff"/>' +
        '<rect x="18" y="20.4" width="24" height="1.6" fill="#1f6f54" opacity=".55"/>' +
        '<text x="30" y="48.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="17.5" letter-spacing="-.3" fill="#fff">CRM</text>'
  };
  var ITEMS = {
    jira:   { kind: 'folder', name: 'Jira', c: 'jira', kids: [
      { name: 'CRM Space', href: 'https://mcgeedhenry.atlassian.net/jira/software/projects/CRM/boards', c: 'jira', g: 'grid4' },
      { name: 'Watch Space', href: 'https://mcgeedhenry.atlassian.net/jira/software/projects/IW/boards', c: 'jira', g: 'layers' } ] },
    github: { kind: 'folder', name: 'GitHub', c: 'git', kids: [
      { name: 'internship-watch', href: 'https://github.com/HenryDMcGee/internship-watch', c: 'watch', g: 'iw' },
      { name: 'mccombs-course-planner', href: 'https://github.com/HenryDMcGee/mccombs-course-planner', c: 'planner', g: 'cap' },
      { name: 'Resume-Website', href: 'https://github.com/HenryDMcGee/Resume-Website', c: 'site', g: 'hm' },
      { name: 'Mars', href: 'https://github.com/HenryDMcGee/Mars', c: 'mars', g: 'mars' },
      { name: 'CRM', waiting: true, c: 'crm', g: 'crmlogo', aria: 'CRM repo, coming once it is created on GitHub' } ] },
    crmsite:{ kind: 'waiting', name: 'CRM Site', label: 'Waiting…', c: 'crm', g: 'lock', aria: 'crm.mcgeehenry.com, available after Phase 3 ships' },
    crm:    { kind: 'app', name: 'CRM', href: 'https://claude.ai/artifact/6JLKstwRaKPuGY47LfshiD', c: 'crm', g: 'crmlogo' },
    watch:  { kind: 'app', name: 'internship-watch', href: 'https://internship-watch.mcgeehenry.com', c: 'watch', g: 'iw' },
    jobs:   { kind: 'app', name: 'Public Job Board', href: 'https://jobs.mcgeehenry.com', c: 'public', g: 'iw' },
    site:   { kind: 'app', name: 'Henry Website', href: 'https://mcgeehenry.com', c: 'site', g: 'hm' }
  };
  var DEFAULT = { home: ['jira', 'github', 'crmsite'], dock: ['crm', 'watch', 'jobs', 'site'] };
  var KEY = 'cc-ios-layout-v1', DOCK_MAX = 4;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }
  function icon(c, g, extra) {
    if (g === 'iw') return '<span class="icon iw"><svg viewBox="0 0 60 60" aria-hidden="true">' + G.iw + '</svg>' + (extra || '') + '</span>';
    if (g === 'hm') return '<span class="icon hm"><img src="hm-logo.png" alt="" draggable="false">' + (extra || '') + '</span>';
    if (g === 'crmlogo') return '<span class="icon crmi" style="--c: var(--c-crm)"><svg viewBox="0 0 60 60" aria-hidden="true">' + G.crmlogo + '</svg>' + (extra || '') + '</span>';
    return '<span class="icon" style="--c: var(--c-' + c + ')"><svg viewBox="0 0 24 24" aria-hidden="true">' + G[g] + '</svg>' + (extra || '') + '</span>';
  }
  var X = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8"/></svg>';

  function slotHTML(id) {
    var it = ITEMS[id], body;
    if (it.kind === 'folder') {
      var minis = it.kids.map(function (k) { return '<span class="mini" style="--c: var(--c-' + k.c + ')"></span>'; }).join('');
      body = '<button class="app folder" type="button" data-folder="' + id + '" aria-haspopup="dialog"><span class="icon">' + minis + '</span><span class="label">' + esc(it.name) + '</span></button>';
    } else if (it.kind === 'waiting') {
      body = '<span class="app waiting" role="note" aria-label="' + esc(it.aria) + '">' + icon(it.c, it.g, '<span class="progress"><i></i></span>') + '<span class="label">' + esc(it.label) + '</span></span>';
    } else {
      body = '<a class="app" href="' + esc(it.href) + '" target="_blank" rel="noopener" title="' + esc(it.name) + '" draggable="false">' + icon(it.c, it.g) + '<span class="label">' + esc(it.name) + '</span></a>';
    }
    var d = (-Math.random() * 0.26).toFixed(2);
    return '<div class="slot" data-id="' + id + '" style="--d: ' + d + 's">' + body +
      '<button class="del" type="button" data-del="' + id + '" aria-label="Remove ' + esc(it.name) + '">' + X + '</button></div>';
  }

  // layout state, remembered per browser
  function clone(l) { return { home: l.home.slice(), dock: l.dock.slice() }; }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.home) && Array.isArray(s.dock)) {
        var ok = function (id) { return Object.prototype.hasOwnProperty.call(ITEMS, id); };
        var l = { home: s.home.filter(ok), dock: s.dock.filter(ok).slice(0, DOCK_MAX) };
        var known = Array.isArray(s.known) ? s.known : [];
        Object.keys(ITEMS).forEach(function (id) { if (known.indexOf(id) < 0 && l.home.indexOf(id) < 0 && l.dock.indexOf(id) < 0) l.home.push(id); });
        return l;
      }
    } catch (e) {}
    return clone(DEFAULT);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ home: layout.home, dock: layout.dock, known: Object.keys(ITEMS) })); } catch (e) {} }
  var layout = load();

  var homeEl = document.getElementById('home'), dockEl = document.getElementById('dock');
  function render() {
    homeEl.innerHTML = layout.home.map(slotHTML).join('');
    dockEl.innerHTML = layout.dock.map(slotHTML).join('');
  }
  function readDOM() {
    layout = {
      home: Array.prototype.map.call(homeEl.querySelectorAll('.slot'), function (s) { return s.getAttribute('data-id'); }),
      dock: Array.prototype.map.call(dockEl.querySelectorAll('.slot'), function (s) { return s.getAttribute('data-id'); })
    };
  }
  render();

  // status bar clock
  var t = document.getElementById('time');
  function tick() { t.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  tick(); setInterval(tick, 30000);

  // original wallpaper: deep-ocean gradient with soft bokeh light
  var c = document.getElementById('wall'), ctx = c.getContext('2d');

    var n = actx.createBufferSource(), hp = actx.createBiquadFilter(), g = actx.createGain();
    n.buffer = hiss; hp.type = 'highpass'; hp.frequency.value = 7000;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    n.connect(hp); hp.connect(g); g.connect(musicGain); n.start(t); n.stop(t + 0.06);
  }
  function wood(t, v) {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(1250, t); o.frequency.exponentialRampToValueAtTime(820, t + 0.05);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.08);
  }
  function playStep(i, t) {
    var inBar = i % 8, ch = CH[Math.floor(i / 4)];
    if (MEL[i]) bell(t, MEL[i], 0.2);
    if (inBar % 4 === 0) pluck(t, ch[0], 0.32, 0.45, 900);                         // bass on beats 1 and 3
    if (inBar % 2 === 1) pluck(t, ch[1][[0, 1, 2, 1][(inBar - 1) / 2]], 0.07, 0.3, 2600);  // koto-ish off-beat arpeggio
    if (inBar === 2 || inBar === 6) wood(t, 0.06);                                  // wood block on beats 2 and 4
    shaker(t, inBar % 2 ? 0.012 : 0.022);
  }
  function scheduler() {
    while (nextTime < actx.currentTime + 0.15) { playStep(step, nextTime); nextTime += EIGHTH; step = (step + 1) % MEL.length; }
  }
  function startMusic() {
    if (!musicOn || mode !== 'phone' || musicTimer) return;
    var ac = audio(); if (!ac) return;
    if (ac.state !== 'running') return;
    if (!musicGain) { musicGain = ac.createGain(); musicGain.connect(master); }
    var t = ac.currentTime;
    musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(0.0001, t); musicGain.gain.exponentialRampToValueAtTime(0.34, t + 1.2);
    step = 0; nextTime = t + 0.08;
    scheduler(); musicTimer = setInterval(scheduler, 25);
  }
  function stopMusic() {
    if (!musicTimer) return;
    clearInterval(musicTimer); musicTimer = null;
    var t = actx.currentTime;
    musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(Math.max(musicGain.gain.value, 0.0001), t); musicGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  }
  musicBtn.addEventListener('click', function () {
    musicOn = !musicOn;
    musicBtn.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
    try { localStorage.setItem('cc-music', musicOn ? 'on' : 'off'); } catch (e) {}
    if (musicOn) { unlockAudio(); whenAudio(startMusic); } else stopMusic();
  });

  function setMode(m) {
    stopIntro(); exitEdit(); closeSheet();
    if (m !== 'phone') stopMusic();
    mode = m;
    if (m === 'phone') { host.insertBefore(appEl, host.firstChild); document.body.classList.add('phone-mode'); fit(); }
    else { document.body.insertBefore(appEl, document.body.firstChild); document.body.classList.remove('phone-mode'); }
    paint();
  }
  document.getElementById('viewbtn').addEventListener('click', function () {
    setMode('full');
    try { history.replaceState(null, '', '#full'); } catch (e) {}
  });
  document.getElementById('phonebtn').addEventListener('click', function () {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    unlockAudio(); setMode('phone'); runIntro(); whenAudio(startMusic);
  });
  document.getElementById('homebtn').addEventListener('click', function () { unlockAudio(); runIntro(); whenAudio(startMusic); });

  if (location.hash === '#full') setMode('full'); else { setMode('phone'); runIntro(); }
})();
</script>
